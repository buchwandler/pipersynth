[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pipersynth"
dynamic = ["version"]
description = "Independent Python synthesis runtime for Piper-compatible ONNX TTS models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "PiperSynth contributors"}]
dependencies = [
  "numpy>=1.23",
  "piperg2p>=0.1.7,<0.2",
  "onnxvoice>=0.1.10,<0.2",
  "audiosig>=0.1.4,<0.2",
 ]
keywords = ["tts", "text-to-speech", "piper", "onnx", "speech", "onnxruntime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu]>=0.1,<0.2"]
gpu = ["onnxvoice[gpu]>=0.1,<0.2"]
catalog = ["onnxvoice>=0.1,<0.2"]
playback = ["sounddevice>=0.5,<0.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipersynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests requiring optional runtimes or external voice assets",
  "network: tests requiring network access",
  "resource_heavy: tests requiring large resources",
]
addopts = "-q --strict-markers"

[tool.setuptools.package-data]
pipersynth = ["py.typed", "data/*.json"]

[tool.setuptools_scm]
write_to = "pipersynth/_version.py"
fallback_version = "0.1.1"

[tool.coverage.run]
omit = ["pipersynth/_version.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["pipersynth"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
