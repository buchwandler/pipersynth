    observed_behavior:
      Replaces text-splitting and chunk-oriented synthesis with typed
      SynthesisRequest and SynthesisResult APIs. Each request is phonemized as a whole
      and sent through one model inference; known capacity overflow raises SynthesisInputTooLongError
      instead of splitting or retrying. Caller owns request boundaries, and token annotations
      including morph are forwarded.
    public_impact: public
    decision: accepted
    stale: false
    evidence_subject: "feat: provice API for atomic text senthesize"
    target_entry_id: entry-0001
    notes:
      Coverage owner for the atomic prepared-text request behavior and its migration
      guidance.
