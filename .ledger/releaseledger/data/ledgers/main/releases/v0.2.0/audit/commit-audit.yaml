    observed_behavior:
      Removes the document pipeline, planning, preparation, composition,
      and former result APIs and runtime dependencies. The replacement PiperVoice surface
      accepts prepared speakable text and leaves document-level responsibilities to
      callers and downstream audio layers. Voice-level calibration is static and opt-in.
    public_impact: public
