    observed_behavior:
      Adds request-local Phrasplit text splitting and the corresponding
      dependency, but the subsequent a138121 commit replaces that behavior with atomic
      synthesis requests and caller-owned boundaries. The final engine API does not
      import or call Phrasplit; the candidate metadata cleanup is recorded in the implementation
      task.
    public_impact: public
    decision: accepted
    stale: false
    evidence_subject: "feat: add phrasplit to handle long text input"
    target_entry_id: entry-0001
    notes:
      Grouped with the later atomic-request behavior so the entry describes the
      net public contract, not a superseded intermediate splitting feature.
