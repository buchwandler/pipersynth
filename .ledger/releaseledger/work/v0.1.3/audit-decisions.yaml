    observed_behavior:
      "Introduces a LoudnessConfig policy validated on pipeline and
      synthesis configuration, a strictly validated offline calibration catalog keyed
      by exact piper model, quality, and speaker identities, static gain application
      between legacy peak normalization and user volume with a single final clamp,
      calibration diagnostics in inference and result metadata, target_lufs rejection
      for streaming unit preparation, and managed-bundle voice loading that preserves
      catalog identity."
    public_impact: public
    decision: accepted
    target_entry_key: null
