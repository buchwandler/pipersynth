  - kind: added
    summary: Added the packaged voice loudness calibration catalog for measured Piper speaker identities at -24 LUFS
    body:
      "The packaged catalog records BS.1770 gain, measured LUFS, and variability
      for identities measured from corpus pipersynth-count-1-to-10-v1 with a -1 dBTP
      calibration ceiling. docs/performance.md documents that Vietnamese and Chinese
      identities must be remeasured after PiperG2P phoneme coverage changes."
    status: accepted
