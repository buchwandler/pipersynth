  - kind: quality
    summary: Improved loudness benchmark measurement with isolated per-model workers and phase-tagged failure reporting
    body:
      "One pipeline is opened per model and reused across its speaker identities.
      Each model runs in a fresh worker process with atomic JSON results. Failures carry
      phase and error_type fields, non-finite metrics are rejected, and locale count
      stimuli are resolved in a preflight before any synthesis."
    status: accepted
