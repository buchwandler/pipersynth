entries:
  - kind: added
    summary:
      Added calibrated voice leveling with LoudnessConfig and a validated offline
      per-voice gain catalog
    body:
      "LoudnessConfig configures voice leveling, target LUFS, true-peak ceiling,
      peak policy, and an explicit voice gain on pipeline and synthesis configuration.
      Calibration lookup uses exact piper model, quality, and speaker identities from
      a strictly validated offline catalog and applies one deterministic static gain
      after legacy peak normalization. Synthesis never measures LUFS at runtime and
      missing identities are zero-gain diagnostic no-ops."
    status: accepted
    source_refs:
      - git:e4f1c6860f03ffec363d09ac2d03c0eeaad4aad4
    paths:
      - pipersynth/loudness_config.py
      - pipersynth/voice_level.py
