    prs: []
    issues: []
    contributors:
      - "@holgern"
  - kind: changed
    summary: Changed complete-output rendering to apply target LUFS and true-peak ceiling policy for whole-document output
    body:
      "The AudioJob output policy forwards target_lufs, true_peak_ceiling_dbtp,
      and peak_policy to composition for whole-document output. Streaming unit preparation
      rejects target_lufs instead of normalizing units independently. Calibration mode,
      key, gain, and source are recorded in inference metadata and AudioResult metadata."
    status: accepted
    source_refs: []
    paths:
