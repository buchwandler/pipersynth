entries:
  - kind: changed
    summary: Changed PiperSynth to leave preparation, request boundaries, and composition to caller-owned layers
    body: >-
      PiperSynth 0.2.0 accepts prepared, speakable text as atomic synthesis
      requests, not documents or plans. The former public APIs PiperPipeline,
      PipelineConfig, GenerationConfig, UtterancePlan, UtterancePlanner,
      AudioResult, AudioUnitResult, LoudnessConfig, and PreparedTextResult are
      removed; document planning, text preparation, and composition belong elsewhere.
      The UtterPlan, AudioCompose, and SSMD runtime dependencies are also removed.
      To migrate from 0.1.x, move document parsing, written-form expansion, and
      planning to the caller; create one SynthesisRequest per desired speech unit
      and call PiperVoice.synthesize(), or use synthesize_text() for one prepared request.
      Each call performs one acoustic inference and does not choose text boundaries or retry an
      over-capacity request. Split long text in the caller and handle
      SynthesisInputTooLongError. Compose semantic pauses and timelines, and
      perform final mastering, in a downstream layer such as AudioCompose.
      Static per-identity voice-level calibration remains opt-in and is not
      final LUFS or true-peak mastering.
    breaking: true
    status: accepted
