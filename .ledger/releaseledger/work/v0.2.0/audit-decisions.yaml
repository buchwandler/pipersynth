      - pipersynth/voice.py
      - pipersynth/voice_level.py
      - tests/test_engine_public_api.py
      - tests/test_engine_voice.py
    observed_behavior: >-
      Removes the document pipeline, planning, preparation, composition, and former
      result APIs and runtime dependencies. The replacement PiperVoice surface
      accepts prepared speakable text and leaves document-level responsibilities
      to callers and downstream audio layers. Voice-level calibration is static
      and opt-in.
    public_impact: public
    decision: accepted
    target_entry_key: null
    target_entry_id: null
    notes: >-
      Coverage owner for the 0.2.0 migration entry; public callers must move
      preparation, planning, and composition out of PiperSynth.
    stale: false
