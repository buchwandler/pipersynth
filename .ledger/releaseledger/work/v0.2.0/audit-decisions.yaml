  - sha: 7a6acb03a1a505cda494966e3a98e3448bb7695e
    inspected: true
    inspected_paths:
      - README.md
      - docs/architecture.md
      - docs/performance.md
      - examples/long_text.py
      - pipersynth/types.py
      - pipersynth/voice.py
      - pyproject.toml
      - tests/test_engine_public_api.py
      - tests/test_engine_voice.py
    observed_behavior: >-
      Adds request-local Phrasplit text splitting and the corresponding dependency,
      but the subsequent a138121 commit replaces that behavior with atomic
      synthesis requests and caller-owned boundaries. The final engine API does
      not import or call Phrasplit; the candidate metadata cleanup is recorded in
      the implementation task.
    public_impact: public
    decision: accepted
    target_entry_key: null
    target_entry_id: null
    notes: >-
      Grouped with the later atomic-request behavior so the entry describes the
      net public contract, not a superseded intermediate splitting feature.
    stale: false
  - sha: a13812149614374affaf1867ef221b8b0c2704aa
    inspected: true
    inspected_paths:
      - README.md
      - docs/architecture.md
      - docs/performance.md
      - docs/troubleshooting.md
      - pipersynth/__init__.py
      - pipersynth/errors.py
      - pipersynth/types.py
      - pipersynth/voice.py
      - tests/test_engine_public_api.py
      - tests/test_engine_types.py
      - tests/test_engine_voice.py
    observed_behavior: >-
      Replaces text-splitting and chunk-oriented synthesis with typed
      SynthesisRequest and SynthesisResult APIs. Each request is phonemized as a
      whole and sent through one model inference; known capacity overflow raises
      SynthesisInputTooLongError instead of splitting or retrying. Caller owns
      request boundaries, and token annotations including morph are forwarded.
    public_impact: public
    decision: accepted
    target_entry_key: null
    target_entry_id: null
    notes: >-
      Coverage owner for the atomic prepared-text request behavior and its
      migration guidance.
    stale: false
